<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1024, initial-scale=1.0, user-scalable=yes">
    <title>MUHS Result - Summer 2025</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background: #f5deb3;
            min-height: 100vh; 
            padding: 20px; 
        }
        .container { 
            max-width: 900px; 
            margin: 0 auto; 
            background: #f5deb3;
        }
        .header { 
            text-align: center; 
            padding: 30px 20px 10px;
        }
        .header h1 { 
            font-size: 20px; 
            color: #cc0000; 
            font-weight: bold;
            margin-bottom: 15px;
            font-family: Arial, sans-serif;
            letter-spacing: 0.3px;
        }
        .title-link {
            color: #0000ff;
            text-decoration: underline;
            font-size: 14px;
            font-family: "Courier New", Courier, monospace;
            font-weight: bold;
            display: block;
            margin-bottom: 25px;
        }
        .content { 
            padding: 20px; 
        }
        .search-section { 
            background: #f5deb3;
            border: 2px solid #000;
            padding: 25px 40px; 
            margin: 0 auto;
            max-width: 1200px;
        }
        .form-table {
            width: 100%;
            border-collapse: collapse;
        }
        .form-table td {
            padding: 15px 10px;
        }
        .form-table td:first-child {
            width: 200px;
        }
        .form-table label { 
            font-weight: normal;
            color: #000;
            font-size: 14px;
        }
        select, input[type="text"] { 
            padding: 5px 8px;
            border: 1px solid #666;
            font-size: 14px;
            background: white;
        }
        select {
            min-width: 150px;
        }
        input[type="text"] {
            width: 200px;
        }
        .btn-container {
            text-align: center;
            margin-top: 25px;
        }
        .btn { 
            background: #d3d3d3;
            color: #000;
            padding: 8px 30px;
            border: 2px outset #999;
            font-size: 14px;
            cursor: pointer;
            font-weight: normal;
        }
        .btn:hover { 
            background: #c0c0c0;
        }
        .btn:active {
            border-style: inset;
        }
        .loading { 
            display: none; 
            padding: 40px; 
            text-align: center;
        }
        .spinner { 
            border: 4px solid #f3f3f3; 
            border-top: 4px solid #cc0000; 
            border-radius: 50%; 
            width: 50px; 
            height: 50px; 
            animation: spin 1s linear infinite; 
            margin: 0 auto 20px; 
        }
        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }
        
        .result-page {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>MAHARASHTRA UNIVERSITY OF HEALTH SCIENCES,NASHIK</h1>
            <span class="title-link">SUMMER-2025 Examinations MBBS-(2024) Course Result</span>
        </div>

        <div class="content">
            <div class="search-section" id="searchSection">
                <form id="searchForm">
                    <table class="form-table">
                        <tr>
                            <td><label for="examType">COURSE:</label></td>
                            <td>
                                <select id="examType" required>
                                    <option value="mbbs2024">MBBS-2024</option>
                                    <option value="mbbs2023">MBBS-2023</option>
                                    <option value="mbbs2021">MBBS-2021</option>
                                    <option value="mbbs2019">MBBS-2019</option>
                                </select>
                            </td>
                        </tr>
                        <tr>
                            <td><label for="classYear">CLASS:</label></td>
                            <td>
                                <select id="classYear" required>
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                </select>
                            </td>
                        </tr>
                        <tr>
                            <td><label for="prnNumber">SEAT NUMBER:</label></td>
                            <td>
                                <input type="text" id="prnNumber" required pattern="\d{6}" maxlength="6" oninput="this.value = this.value.replace(/[^0-9]/g, '');">
                            </td>
                        </tr>
                    </table>
                    
                    <div class="btn-container">
                        <button type="submit" class="btn">Submit</button>
                    </div>
                </form>
            </div>

            <div class="loading" id="loadingSection">
                <div class="spinner"></div>
                <p style="color: #666;">Fetching your result...</p>
            </div>

            <div class="result-page" id="resultPage">
                <!-- Result page removed - now redirects to result.html -->
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // CONFIGURATION
        // ============================================
        
        // Prank image URL for non-database entries
        const PRANK_IMAGE_URL = 'https://i.postimg.cc/pVqhh7MZ/unnamed.jpg';
        
        // ============================================
        
        // ============================================
        // DATABASE 
        // ============================================
        
        // Embedded database
        const prankDatabase = {
            "mbbs2024_1_505471": {
                "title": "STATEMENT OF MARKS FOR FIRST MBBS - (2024) - Summer-2025",
                "name": "test obj",
                "college": "Dr. Rajendra Gode Medical College, Ghatkheda,Amravati",
                "seatNumber": "505471",
                "prn": "01232602516",
                "marks": {
                    "subject1": {
                        "name": "ANATOMY",
                        "theory": 116,
                        "practical": 65,
                        "intTheory": 19,
                        "intPract": 27,
                        "total": 46
                    },
                    "subject2": {
                        "name": "PHYSIOLOGY",
                        "theory": 111,
                        "practical": 72,
                        "intTheory": 19,
                        "intPract": 26,
                        "total": 45
                    },
                    "subject3": {
                        "name": "BIOCHEMISTRY",
                        "theory": 131,
                        "practical": 65,
                        "intTheory": 19,
                        "intPract": 27,
                        "total": 46
                    }
                },
                "grandTotal": "560 / 900",
                "result": "PASS",
                "remark": ""
            }
            // more entries go here
        };
        
        // ============================================
        
        document.getElementById('searchForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const seatNumber = document.getElementById('prnNumber').value;
            const classYear = document.getElementById('classYear').value;
            const course = document.getElementById('examType').value;
            
            // Show loading
            document.getElementById('searchSection').style.display = 'none';
            document.getElementById('loadingSection').style.display = 'block';
            
            setTimeout(function() {
                document.getElementById('loadingSection').style.display = 'none';
                
                // Create lookup key with course_class_seat
                const lookupKey = `${course}_${classYear}_${seatNumber}`;
                
                // Check if seat number exists in database
                if (prankDatabase[lookupKey]) {
                    // Store data in sessionStorage and redirect to result page
                    sessionStorage.setItem('resultData', JSON.stringify(prankDatabase[lookupKey]));
                    window.location.href = 'result.html';
                } else {
                    // Redirect to prank image page
                    window.location.href = 'prank.html';
                }
            }, 1500);
        });

        function resetForm() {
            document.getElementById('searchForm').reset();
            document.getElementById('searchSection').style.display = 'block';
            document.getElementById('resultPage').style.display = 'none';
        }
    </script>
</body>
</html>
